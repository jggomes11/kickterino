name: Windows validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      runner:
        description: Native Windows environment
        type: choice
        options: [windows-2025, windows-2022]
        default: windows-2025

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}-${{ inputs.runner == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
  cancel-in-progress: true

jobs:
  windows:
    name: Native Windows UI and packaging
    runs-on: ${{ inputs.runner == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 25
    env:
      VALIDATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the pinned Electron runtime
        run: node node_modules/electron/install.js
      - name: Run security regression tests
        run: npm test
      - name: Validate metrics collector on both PowerShell versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation-output/evidence | Out-Null
          & ./tests/metrics.test.ps1 -ProofPath ./validation-output/evidence/metrics-pwsh.json
          & powershell.exe -NoProfile -File ./tests/metrics.test.ps1 -ProofPath ./validation-output/evidence/metrics-windows-powershell.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell metrics tests failed' }
      - name: Validate native Electron session transport
        run: npm run test:electron
      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev
      - name: Package Windows without publishing
        id: package
        run: |
          npm run dist -- --dir --publish never
      - name: Validate packaged UI and official login navigation
        run: node scripts/validate-desktop.cjs
      - name: Validate four account partitions in one application
        if: success()
        timeout-minutes: 5
        run: node scripts/validate-accounts.cjs dist/win-unpacked/Kickterino.exe validation-output/evidence/account-validation.json
      - name: Prepare isolated manual validation bundle
        if: always() && steps.package.outcome == 'success'
        run: node scripts/package-windows-validation.cjs
      - name: Verify the manual bundle launcher
        if: always() && steps.package.outcome == 'success'
        run: ./validation-output/Start-WindowsValidation.ps1 -CheckOnly
      - name: Verify packaged application measurement launcher
        if: success() && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $SampleDirectory=Join-Path $env:RUNNER_TEMP ('packaged-collector-'+$env:GITHUB_RUN_ID)
          try {
            & ./validation-output/Start-WindowsValidation.ps1 -Measure -Diagnostics -WarmupSeconds 0 -DurationSeconds 5 -OutputDirectory $SampleDirectory
            $Sample=Get-Content (Join-Path $SampleDirectory 'summary.json') -Raw | ConvertFrom-Json
            if($Sample.samples -lt 1 -or $Sample.endedEarly -or $null -eq $Sample.privateBytes){throw 'Packaged collector integration failed'}
            @{passed=$true; samples=$Sample.samples; purpose='collector integration only, anonymous isolated profile'; performanceMeasured=$false; naturalExitMeasured=$false} | ConvertTo-Json | Set-Content validation-output/evidence/packaged-collector-smoke.json
          }finally{
            $EnvironmentFile=Join-Path $SampleDirectory 'environment.json'
            if(Test-Path $EnvironmentFile){
              $SampleEnvironment=Get-Content $EnvironmentFile -Raw | ConvertFrom-Json
              $SampleRootId=[int]$SampleEnvironment.rootProcessId
              if($SampleRootId -gt 0){& taskkill.exe /PID $SampleRootId /T /F | Out-Null}
            }
          }
      - name: Verify existing-profile selection stays inside the isolated profile root
        if: always() && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $ProbeProfile = Join-Path $env:LOCALAPPDATA 'ChannelClientValidation/kickterino/000000000000'
          New-Item -ItemType Directory -Path $ProbeProfile -Force | Out-Null
          try { ./validation-output/Start-WindowsValidation.ps1 -CheckOnly -ProfileCommit '000000000000' }
          finally { Remove-Item -LiteralPath $ProbeProfile -Force }
      - name: Preserve Windows evidence and validation build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kickterino-windows-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation-output/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
