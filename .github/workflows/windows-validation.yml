name: Validate Windows candidate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:electron
      - run: npm run test:accounts
      - run: npm audit
      - run: npm audit --omit=dev
      - run: node scripts/package-windows-release.cjs
      - run: node scripts/validate-accounts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickterino-windows-candidate
          path: release-output/
          if-no-files-found: warn
